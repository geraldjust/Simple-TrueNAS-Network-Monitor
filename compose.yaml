services:
  network-monitor:
    image: ghcr.io/geraldjust/simple-truenas-network-monitor:latest
    container_name: simple-truenas-network-monitor
    network_mode: host
    pid: host
    restart: unless-stopped
    environment:
      PORT: "8090"
      DATA_DIR: /data
    volumes:
      - network-monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  network-monitor-data:
